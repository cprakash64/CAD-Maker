name: Evaluation harness (deterministic subset)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend test suite
        env:
          LLM_PROVIDER: mock
          APP_ENV: development
          TESTING: "true"
        run: python -m pytest -q

  eval-harness:
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate eval fixtures against the schema
        run: python -m eval.cli validate
      - name: Run the deterministic evaluation baseline
        # No --live: offline/mock only, no secrets required. This is the CI
        # gate; --live (real OpenAI) is never run automatically -- see
        # eval/README.md.
        run: python -m eval.cli run --out eval_reports/ci
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval_reports/ci/
