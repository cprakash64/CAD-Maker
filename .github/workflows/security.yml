name: Security scanning (dependencies, secrets, SBOM)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: pip-audit (backend)
        # Hard gate: fails on any finding NOT already in the reviewed
        # allowlist (backend/.pip-audit-allowlist.json). Each allowlist entry
        # has a written reachability justification -- see
        # docs/security/dependency-risk-assessment.md. This replaced a
        # permanent `|| true` report-only step now that the tree is clean
        # except for the documented, justified exceptions.
        run: |
          pip install pip-audit
          pip install -r backend/requirements.txt
          python scripts/check_pip_audit_allowlist.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        # Hard gate: same allowlist pattern as pip-audit above, see
        # frontend/.npm-audit-allowlist.json.
        run: |
          cd frontend
          npm ci
          cd ..
          python3 scripts/check_npm_audit_allowlist.py

  hash-locked-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install strictly from the hash-pinned lock file
        # Proves backend/requirements.lock.txt (regenerate with
        # `pip-compile --generate-hashes --output-file=requirements.lock.txt
        # requirements.txt`, see docs/security/dependency-risk-assessment.md)
        # is complete, current, and installable with --require-hashes, i.e.
        # every package and its full transitive closure is pinned to an
        # exact, hash-verified artifact -- not just the direct pins in
        # requirements.txt.
        run: |
          python -m venv /tmp/hashcheck-venv
          /tmp/hashcheck-venv/bin/pip install --require-hashes -r backend/requirements.lock.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fast pre-commit-style guard (narrow patterns, no install)
        run: bash scripts/check-secrets.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Broad scan for secrets outside the audited baseline
        # Both steps fail the build -- see docs/ops/security-scanning.md.
        run: python scripts/check_secrets_baseline.py

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend + cyclonedx-bom
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install cyclonedx-bom
      - name: Generate backend SBOM
        run: |
          backend/.venv/bin/cyclonedx-py environment backend/.venv/bin/python \
            -o sbom/backend-sbom.cdx.json --output-format json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Generate frontend SBOM
        run: |
          cd frontend
          npm ci
          npm sbom --sbom-format cyclonedx > ../sbom/frontend-sbom.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
