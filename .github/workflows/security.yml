name: Security scanning (dependencies, secrets, SBOM)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: pip-audit (backend)
        # Report-only: several current findings are transitive and tracked
        # (docs/ops/security-scanning.md), not silently ignored -- a
        # hard-fail-on-any-finding gate here would be permanently red. The
        # secret-scanning job below IS a hard gate.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        run: |
          cd frontend
          npm ci
          npm audit || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast pre-commit-style guard (narrow patterns, no install)
        run: bash scripts/check-secrets.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Broad scan for secrets outside the audited baseline
        # Both steps fail the build -- see docs/ops/security-scanning.md.
        run: python scripts/check_secrets_baseline.py

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend + cyclonedx-bom
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install cyclonedx-bom
      - name: Generate backend SBOM
        run: |
          backend/.venv/bin/cyclonedx-py environment backend/.venv/bin/python \
            -o sbom/backend-sbom.cdx.json --output-format json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Generate frontend SBOM
        run: |
          cd frontend
          npm ci
          npm sbom --sbom-format cyclonedx > ../sbom/frontend-sbom.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
